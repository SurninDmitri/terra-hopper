<div id="hopper-card-{{ hopper.id }}" class="bg-white p-4 rounded shadow">
    <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-semibold">{{ hopper.name }}</h2>
        <a href="{% url 'hopper:game' hopper.id %}"
           class="px-4 py-2 rounded bg-purple-600 text-white text-sm hover:bg-purple-700">
            Запустить заезд
        </a>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm text-gray-700">
        <div>Масса: {{ hopper.mass_kg }} кг</div>
        <div>Положение: {{ hopper.get_location_state_display }}</div>
        <div>Рекорд: {{ hopper.best_distance|floatformat:1 }} м</div>
        <div>Дата создания: {{ hopper.created_at|date:"d.m.Y" }}</div>
    </div>

    <div id="hopper-error-{{ hopper.id }}"></div>
</div>
