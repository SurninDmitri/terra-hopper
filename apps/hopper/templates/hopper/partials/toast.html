<div id="game-toast" class="pointer-events-auto bg-red-600 text-white text-sm px-4 py-2 rounded shadow-lg" style="opacity: 1; transition: opacity 0.5s;">
    {{ error_message }}
</div>
<script>
    (function () {
        const toast = document.getElementById('game-toast');
        if (toast) {
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2500);
            setTimeout(() => toast.remove(), 3000);
        }
    })();
</script>
