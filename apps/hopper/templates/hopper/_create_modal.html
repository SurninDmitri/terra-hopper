{% load static %}
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md mx-4">
        <div class="relative">
            <img src="{% static 'terra-hopper.png' %}" alt="Terra Hopper" class="w-full h-40 object-cover rounded-t-lg">
        </div>
        <form hx-post="{% url 'create_hopper' %}" hx-target="#garage-list" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful){ document.getElementById('modal-container').innerHTML=''; }">
            {% csrf_token %}
            <div class="p-4 space-y-3">
                {% if error %}
                    <div class="bg-red-50 text-red-700 p-2 rounded text-sm">{{ error }}</div>
                {% endif %}
                <div>
                    <label class="block text-sm font-medium mb-1">Имя транспорта</label>
                    <input type="text" name="name" value="{{ name|default:'' }}" class="w-full border rounded px-3 py-2" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Масса (кг)</label>
                    <input type="number" step="0.1" name="mass_kg" value="{{ mass_kg|default:'' }}" class="w-full border rounded px-3 py-2" placeholder="100.0 - 500.0" required>
                    <p class="text-xs text-gray-500 mt-1">Допустимый диапазон: 100.0 … 500.0 кг</p>
                </div>
                <div class="bg-gray-50 p-3 rounded text-sm space-y-1">
                    <div>Начальный запас силы: <span class="font-medium">100.0 %</span></div>
                    <div>Начальная энергия реактора: <span class="font-medium">100.0 %</span></div>
                    <div>Начальное положение: <span class="font-medium">На поверхности (surface)</span></div>
                    <div>Начальная дистанция: <span class="font-medium">0.0 м</span></div>
                </div>
            </div>
            <div class="flex justify-end gap-2 p-4 border-t">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 rounded border">Отмена</button>
                <button type="submit" class="px-4 py-2 rounded bg-blue-600 text-white">Создать</button>
            </div>
        </form>
    </div>
</div>
